function tr(text){return translations[currentLanguage]?.[text]||extraTranslations[currentLanguage]?.[text]||formTranslations[currentLanguage]?.[text]||text}
function money(value){return new Intl.NumberFormat(locales[currentLanguage],{style:"currency",currency:"EUR"}).format(value)}
function translateApp(root=document.getElementById("app")){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const value=node.nodeValue.trim();if(tr(value)!==value)node.nodeValue=node.nodeValue.replace(value,tr(value))}root.querySelectorAll("input[placeholder]").forEach(input=>{input.placeholder=tr(input.placeholder)})}
function setLanguage(language){currentLanguage=language;document.documentElement.lang=locales[language].slice(0,2);const label=language==="fr"?"Langue de l’interface":language==="en"?"Interface language":"Idioma de la interfaz";const clientNumber=document.getElementById("cid").value;const secretCode=document.getElementById("secret").value;const firstStepHidden=document.getElementById("s1").classList.contains("hide");const secondStepHidden=document.getElementById("s2").classList.contains("hide");const loginSection=document.getElementById("login");loginSection.innerHTML=baseLoginMarkup;document.getElementById("cid").value=clientNumber;document.getElementById("secret").value=secretCode;document.getElementById("s1").classList.toggle("hide",firstStepHidden);document.getElementById("s2").classList.toggle("hide",secondStepHidden);translateApp(loginSection);document.querySelectorAll("[data-language]").forEach(select=>{select.value=language;select.setAttribute("aria-label",label)});document.querySelector(".nav").innerHTML=baseNavMarkup;document.getElementById("side").innerHTML=baseSideMarkup;go(currentPage);updateClock()}
function updateClock(){const output=document.getElementById("local-clock");if(output)output.textContent=new Intl.DateTimeFormat(locales[currentLanguage],{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());const label=document.getElementById("clock-label");if(label)label.textContent=tr("Heure locale")}
function setupHeader(){const user=document.querySelector(".head .user");user.innerHTML="<b>FRANCOIS MIECHOWOSKI</b><br><span class=mut>Belgique · Bruxelles</span>";const tools=document.createElement("div");tools.className="headtools";tools.innerHTML='<div class="clock"><span class="clock-label" id="clock-label">Heure locale</span><span id="local-clock"></span></div><select data-language aria-label="Langue de l’interface" onchange="setLanguage(this.value)"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select>';document.querySelector(".head").append(tools);setInterval(updateClock,1000);updateClock()}
function next(){if(cid.value!=="8745621232")return toast("Numéro client incorrect.");s1.classList.add("hide");s2.classList.remove("hide")}
function back(){s2.classList.add("hide");s1.classList.remove("hide")}

function shell(t,d){return `<div class="crumb"><span>Espace client</span> / <span>${tr(t)}</span></div><div class="title"><div><h1>${tr(t)}</h1><p>${tr(d||"")}</p></div></div>`}
function cards(){return `<div class="cards">${A.map((a,index)=>`<div class="card account"><div class="mut">${a[0]}</div><b>${a[1]}</b><div class="balance">${money(accountBalances[index])}</div><div class="mut">Solde </div><div class="actions"><button class="outline green" onclick="go('tx')">Voir les opérations</button><button class="outline" onclick="modal('Détails','IBAN  : ${a[1]}<br>BIC : DEMOFRPP')">Détails</button></div></div>`).join("")}</div>`}
function table(r=T){return `<table><thead><tr><th>Date</th><th>Libellé</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="${x[3]}">${x[2]}</td><td>Comptabilisé</td></tr>`).join("")}</tbody></table>`}
function home(){const total=accountBalances.reduce((sum,balance)=>sum+balance,0);const savingsTotal=accountBalances.slice(1).reduce((sum,balance)=>sum+balance,0);return shell("Synthèse","Bonjour FRANCOIS MIECHOWOSKI, voici une vue d'ensemble.")+`<div class="notice"><b>Bienvenue dans votre espace client</b><br>Tous les montants et mouvements sont s.</div><div class="stats"><div class="card"><span class="mut">Liquidités</span><div class="metric">${money(total)}</div></div><div class="card"><span class="mut">Disponible</span><div class="metric">${money(accountBalances[0])}</div></div><div class="card"><span class="mut">Épargne</span><div class="metric">${money(savingsTotal)}</div></div><div class="card"><span class="mut">Messages</span><div class="metric">2</div></div></div><br>${cards()}<br><div class="card table"><div class="tabletop"><h2>Dernières opérations</h2><button class="outline green" onclick="go('tx')">Tout voir</button></div>${table(T.slice(0,6))}</div><div class="foot">Prototype pédagogique  inspiré de la structure publique des services numériques BNP Paribas.</div>`}
function accounts(){return shell("Mes comptes","Consultez vos comptes et soldes.")+cards()+`<br><div class="card"><h2>Services liés aux comptes</h2><div class="actions"><button class="outline" onclick="modal('RIB ','IBAN : FR76 XXXX XXXX XXXX 4821<br>BIC : DEMOFRPP')">Afficher un RIB</button><button class="outline" onclick="modal('Relevés','Vos relevés s sont dans Documents et relevés.')">Relevés</button></div></div>`}

function filter(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("tb").innerHTML=table(T.filter(x=>x.join(" ").toLowerCase().includes(q)))}
function payments(){return shell("Virements & paiements","Saisissez les informations du virement . Aucun transfert réel ne sera effectué.")+`<div class="card transfer-form"><h2>Créer un virement</h2><label for="sourceAccount">Compte à débiter</label><select id="sourceAccount">${A.map((account,index)=>`<option value="${index}">${tr(account[0])} — ${money(accountBalances[index])}</option>`).join("")}</select><label for="recipient">Bénéficiaire</label><input id="recipient" autocomplete="off" placeholder="Nom et prénom"><label for="recipientEmail">Email du destinataire</label><input id="recipientEmail" type="email" autocomplete="off" placeholder="email@exemple.com"><label for="recipientIban">IBAN du bénéficiaire</label><input id="recipientIban" autocomplete="off" placeholder="FR76…" maxlength="34"><label for="transferAmount">Montant (€)</label><input id="transferAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"><label for="transferReason">Motif</label><input id="transferReason" maxlength="70" placeholder="Motif du virement"><button class="primary" onclick="transfer()">Confirmer le virement </button><p class="transfer-notice"></p></div>`}
function transfer(){const sourceIndex=Number(document.getElementById("sourceAccount").value);const recipient=document.getElementById("recipient").value.trim();const recipientEmail=document.getElementById("recipientEmail").value.trim();const iban=document.getElementById("recipientIban").value.replace(/\s/g,"").toUpperCase();const amount=Number(document.getElementById("transferAmount").value);const reason=document.getElementById("transferReason").value.trim();if(!recipient||!/^([A-Z]{2}\d{2}[A-Z0-9]{11,30})$/.test(iban)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipientEmail)||!Number.isFinite(amount)||amount<=0)return toast(tr("Entrez le nom du bénéficiaire, un IBAN valide, un email valide et un montant positif."));if(amount>accountBalances[sourceIndex])return toast(tr("Le solde  de ce compte est insuffisant."));pendingTransfer={sourceIndex,recipient,recipientEmail,iban,amount,reason};modal("Virement  préparé",`<b>${money(amount)}</b><br>${tr("Compte débité")} : ${tr(A[sourceIndex][0])}<br>${escapeHtml(recipient)}<br>${escapeHtml(recipientEmail)}<br>${escapeHtml(iban)}<br>${escapeHtml(reason)}<br><br>${tr("Confirmer ce virement  ?")}<br><button class="primary" style="margin-top:14px" onclick="confirmTransfer()">${tr("Confirmer le virement ")}</button>`)}
function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function confirmTransfer(){if(!pendingTransfer)return;const{sourceIndex,recipient,recipientEmail,amount,reason}=pendingTransfer;if(amount>accountBalances[sourceIndex]){pendingTransfer=null;return toast(tr("Le solde  de ce compte est insuffisant."))}accountBalances[sourceIndex]-=amount;const dateLabel=new Intl.DateTimeFormat(locales[currentLanguage],{day:"2-digit",month:"long",year:"numeric"}).format(new Date());T.unshift([new Intl.DateTimeFormat(locales[currentLanguage],{day:"2-digit",month:"short",year:"numeric"}).format(new Date()),`${tr("Virement  vers")} ${recipient}${reason?` — ${reason}`:""}`,`-${money(amount)}`,"minus"]);pendingTransfer=null;pendingRefresh=true;toast(tr("Envoi de l'email de confirmation…"));if(window.emailjs){emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{to_email:recipientEmail,to_name:recipient,from_name:SENDER_NAME,amount:money(amount),reason:reason||"—",date:dateLabel}).then(()=>toast(tr("Email de confirmation envoyé."))).catch(error=>{console.error("EmailJS error:",error);toast(tr("Échec de l'envoi de l'email."))})}modal("Virement  confirmé",`<b>${tr("Virement effectué avec succès.")}</b><br>${tr("Un email de confirmation a été envoyé à")} <b>${escapeHtml(recipientEmail)}</b>.${emailPreviewHtml(recipient,recipientEmail,amount,reason)}`)}
function emailPreviewHtml(recipient,email,amount,reason){const reasonLine=reason?`<br>${tr("Motif")} : ${escapeHtml(reason)}`:"";return `<div class="fake-email"><div class="fake-email-head"><div><b>${tr("Expéditeur")}</b> : BNP Paribas &lt;&gt;</div><div><b>${tr("Destinataire")}</b> : ${escapeHtml(email)}</div><div><b>${tr("Objet")}</b> : ${tr("Confirmation de virement reçu")}</div></div><div class="fake-email-body">${tr("Bonjour")} ${escapeHtml(recipient)},<br>${tr("Vous avez reçu un virement de")} <b>${money(amount)}</b> ${tr("de la part de")} ${escapeHtml(SENDER_NAME)}.${reasonLine}<br><br><i>${tr("")}</i></div></div>`}
